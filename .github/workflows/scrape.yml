name: Scrape Standings

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install puppeteer
        run: npm install puppeteer

      - name: Run scraper
        run: node scrape.js

      - name: Commit standings.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add standings.json
          git stash
          git pull --rebase
          git stash pop
          git diff --staged --quiet || git commit -m "Update standings $(date -u)"
          git push
